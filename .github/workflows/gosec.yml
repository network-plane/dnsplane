# Static security scan with gosec (https://github.com/securego/gosec).
# Local: ./scripts/gosec.sh   (installs pinned gosec via go install if missing)
name: Gosec

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  gosec:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download deps
        run: go mod download

      - name: Install and run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.25.0
          extra=()
          if [[ -f .gosec.json ]]; then extra+=(-conf .gosec.json); fi
          "$(go env GOPATH)/bin/gosec" "${extra[@]}" -fmt text -sort ./...
